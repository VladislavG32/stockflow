# Только одноразовые тесты. Никогда не объединять с compose.yaml рабочего стенда.
services:
  db:
    image: postgres:17-bookworm
    mem_limit: 384m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_DB: stockflow_ci
      POSTGRES_HOST_AUTH_METHOD: trust
    # Пароль не нужен: сеть internal, порты не публикуются, диск временный.
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U stockflow -d stockflow_ci"]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    # Publish передаёт уже собранный образ: проверяем ровно то, что затем push.
    image: ${CI_MIGRATOR_IMAGE:?Set tested migrator image}
    pull_policy: never
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql://stockflow@db:5432/stockflow_ci
    networks: [isolated]
    depends_on:
      db:
        condition: service_healthy
  app:
    image: ${CI_IMAGE:?Set tested runner image}
    pull_policy: never
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://stockflow@db:5432/stockflow_ci
    networks: [isolated]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  tests:
    image: ${CI_TEST_IMAGE:?Set prebuilt test tools image}
    pull_policy: never
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://stockflow@db:5432/stockflow_ci
      BASE_URL: http://app:3000
      STOCKFLOW_TEST_DATABASE: stockflow_ci
    command: [sh, -ec, "npm run test:integration"]
    networks: [isolated]
    depends_on:
      app:
        condition: service_healthy
networks:
  isolated:
    internal: true
