name: stockflow-teamcity-agent
services:
  agent:
    image: jetbrains/teamcity-agent:2026.2-linux-sudo
    restart: unless-stopped
    # Docker socket даёт права root на TEST. Только доверенный личный репозиторий,
    # без запуска fork PR. На STAGE/PROD сокет не передаётся.
    user: "0"
    # Обратный SSH-туннель Windows→TEST слушает только loopback TEST:18111.
    network_mode: host
    environment:
      SERVER_URL: http://127.0.0.1:18111
      AGENT_NAME: stockflow-test-agent
    mem_limit: 768m
    volumes:
      - agent_conf:/data/teamcity_agent/conf
      - /var/run/docker.sock:/var/run/docker.sock
      # Одинаковые пути нужны вложенным docker run: mount выполняет Docker хоста.
      - /opt/buildagent/work:/opt/buildagent/work
      - /opt/buildagent/temp:/opt/buildagent/temp
      - /opt/buildagent/system:/opt/buildagent/system
      - /opt/buildagent/tools:/opt/buildagent/tools
      - /opt/buildagent/plugins:/opt/buildagent/plugins
      - /opt/stockflow-ci/ssh:/root/.ssh:ro
volumes:
  agent_conf:
