name: stockflow-teamcity-agent
services:
  agent:
    image: jetbrains/teamcity-agent:2026.2-linux-sudo
    restart: unless-stopped
    # Docker socket даёт права root на TEST. Только доверенный личный репозиторий,
    # без запуска fork PR. На STAGE/PROD сокет не передаётся.
    user: "0"
    environment:
      # Фактически Server обнаружен на TEST: http://192.168.56.11:8111.
      # Повторно проверить после старта VM; localhost внутри agent не подходит.
      SERVER_URL: ${TEAMCITY_SERVER_URL:?Set TEAMCITY_SERVER_URL in private env file}
      AGENT_NAME: stockflow-test-agent
    mem_limit: 768m
    volumes:
      - agent_conf:/data/teamcity_agent/conf
      - /var/run/docker.sock:/var/run/docker.sock
      # Отдельные каталоги хоста: build-agent на TEST использует /opt/buildagent.
      # Stage выполняет Git/SSH из контейнера; вложенные docker run здесь не нужны.
      - /opt/stockflow-test-agent/work:/opt/buildagent/work
      - /opt/stockflow-test-agent/temp:/opt/buildagent/temp
      - /opt/stockflow-test-agent/system:/opt/buildagent/system
      - /opt/stockflow-test-agent/tools:/opt/buildagent/tools
      - /opt/stockflow-test-agent/plugins:/opt/buildagent/plugins
      - /opt/stockflow-ci/ssh:/root/.ssh:ro
volumes:
  agent_conf:
