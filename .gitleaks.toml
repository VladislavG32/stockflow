title = "StockFlow — стандартные правила поиска секретов"
[extend]
useDefault = true

# Дополнительное правило ловит только синтетическую метку безопасной демонстрации.
# Строка создаётся временным скриптом вне исходников; это НЕ действующий ключ.
[[rules]]
id = "stockflow-training-marker"
description = "Учебный маркер, никогда не использовать как пароль"
regex = '''STOCKFLOW_DEMO_[A-Z0-9]{20}'''
keywords = ["STOCKFLOW_DEMO_"]
